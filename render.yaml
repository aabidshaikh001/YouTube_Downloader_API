# Render blueprint — deploy with "New > Blueprint" and point it at
# this repo, or create the Web Service manually with the same values.
# Plan: free (512 MB RAM, sleeps after ~15 min idle — the extension
# handles the cold start; see extension-integration/api-client.js).
# No Docker: Render's native Node runtime. FFmpeg/ffprobe come from
# the ffmpeg-static + ffprobe-static npm packages (prebuilt binaries
# installed by `npm ci`), and yt-dlp is downloaded by the build
# command below (the standalone binary, no pip needed).
services:
  - type: web
    name: youtube-downloader-api
    runtime: node
    buildCommand: npm ci && mkdir -p bin && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp && chmod +x bin/yt-dlp && ./bin/yt-dlp --version
    startCommand: node src/server.js
    plan: free
    # Singapore is closest to India; pick the region nearest your users.
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      # Binaries: yt-dlp from the build step, ffmpeg/ffprobe from
      # the static npm packages.
      - key: YTDLP_PATH
        value: ./bin/yt-dlp
      - key: FFMPEG_PATH
        value: ./node_modules/ffmpeg-static/ffmpeg
      - key: FFPROBE_PATH
        value: ./node_modules/ffprobe-static/bin/linux/x64/ffprobe
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: MAX_DOWNLOAD_SIZE_MB
        value: 500
      - key: DOWNLOAD_TIMEOUT_MINUTES
        value: 20
      - key: JOB_TTL_MINUTES
        value: 30
      - key: CLEANUP_INTERVAL_MINUTES
        value: 5
      - key: RATE_LIMIT_MAX
        value: 100
      - key: DOWNLOAD_RATE_LIMIT_MAX
        value: 20
      # Comma-separated web origins allowed to call the API.
      # chrome-extension:// origins are allowed by default and do
      # not need to be listed here.
      - key: CORS_ORIGINS
        value: ""
