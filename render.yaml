# Render blueprint — deploy with "New > Blueprint" and point it at
# this repo. Render builds the Dockerfile below (no build/start
# command needed — the image bakes in yt-dlp + ffmpeg and runs
# `node src/server.js`). Plan: free (512 MB RAM, sleeps after ~15 min
# idle — the extension handles the cold start; see
# extension-integration/api-client.js).
# Binaries are baked into the image: yt-dlp is the standalone binary
# at /usr/local/bin/yt-dlp, ffmpeg/ffprobe come from apt (on PATH).
# The ffmpeg-static / ffprobe-static npm packages remain installed
# as a fallback for local non-Docker runs.
services:
  - type: web
    name: youtube-downloader-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Singapore is closest to India; pick the region nearest your users.
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # yt-dlp is baked into the image at this path.
      - key: YTDLP_PATH
        value: /usr/local/bin/yt-dlp
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: MAX_DOWNLOAD_SIZE_MB
        value: 500
      - key: DOWNLOAD_TIMEOUT_MINUTES
        value: 20
      - key: JOB_TTL_MINUTES
        value: 30
      - key: CLEANUP_INTERVAL_MINUTES
        value: 5
      - key: RATE_LIMIT_MAX
        value: 100
      - key: DOWNLOAD_RATE_LIMIT_MAX
        value: 20
      # Comma-separated web origins allowed to call the API.
      # chrome-extension:// origins are allowed by default and do
      # not need to be listed here.
      - key: CORS_ORIGINS
        value: ""
